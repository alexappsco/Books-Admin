<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة دار نشر جديدة - Youni</title>
    <link href="css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', sans-serif; }
        .header-bg { background: rgba(136, 108, 232, 1); }
        .active-link { background: rgba(136, 108, 232, 0.3); font-weight: 700; }
        .nav-link { font-size: 14px; font-weight: 500; transition: all 0.3s; }
    </style>
</head>
<body class="bg-gray-50">

    <header class="header-bg h-16 w-full flex items-center justify-between px-4 md:px-8 fixed top-0 z-[100]">
        <div class="flex items-center"><img src="imgs/logoHeader.png" alt="Youni" class="h-8 md:h-10"></div>
        <div class="flex items-center gap-4 text-white">
            <div class="flex items-center gap-4 border-l pl-4 border-white/20">
                <div class="relative cursor-pointer">
                    <span class="absolute -top-1 -right-1 bg-red-500 text-[10px] rounded-full px-1">1</span>
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-gray-200 overflow-hidden"><img src="https://ui-avatars.com/api/?name=User" alt=""></div>
                    <span class="hidden md:block text-sm font-medium">اسم المستخدم</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-white"><svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        </div>
    </header>

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-[80] hidden"></div>

    <div class="flex pt-16">
        <aside id="sidebar" class="w-64 h-[calc(100vh-64px)] fixed right-0 top-16 z-[90] overflow-y-auto transition-transform duration-300 md:translate-x-0 translate-x-full shadow-2xl md:shadow-none bg-white md:bg-[rgba(136,108,232,0.1)]">
            <nav id="sidebar-nav" class="mt-6 px-4 space-y-1"></nav>
        </aside>

        <main class="flex-1 md:mr-64 p-4 md:p-8 min-h-screen w-full">
            <h1 class="text-[24px] md:text-[28px] font-bold text-gray-800 mb-8">إضافة دار نشر جديدة</h1>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
                <div class="flex justify-end mb-8">
                    <label class="cursor-pointer flex flex-col items-center group">
                        <input type="file" accept="image/*" class="hidden">
                        <div class="w-28 h-28 rounded-full border-2 border-dashed border-gray-300 flex flex-col items-center justify-center bg-gray-50 group-hover:bg-gray-100 transition overflow-hidden">
                            <svg class="w-8 h-8 text-gray-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        </div>
                        <span class="text-sm text-[#886CE8] font-semibold mt-2">رفع الشعار</span>
                    </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[15px] font-semibold text-gray-800 mb-2 text-right">اسم دار النشر</label>
                        <input type="text" placeholder="أدخل اسم دار النشر" class="w-full h-[52px] rounded-xl border border-gray-200 px-4 text-right text-[15px] focus:outline-none focus:ring-2 focus:ring-[#886CE8]/20 focus:border-[#886CE8]">
                    </div>
                    <div>
                        <label class="block text-[15px] font-semibold text-gray-800 mb-2 text-right">البريد الإلكتروني</label>
                        <input type="email" placeholder="example@email.com" class="w-full h-[52px] rounded-xl border border-gray-200 px-4 text-right text-[15px] focus:outline-none focus:ring-2 focus:ring-[#886CE8]/20 focus:border-[#886CE8]">
                    </div>
                    <div>
                        <label class="block text-[15px] font-semibold text-gray-800 mb-2 text-right">رقم الهاتف</label>
                        <input type="tel" placeholder="+966 5X XXX XXXX" class="w-full h-[52px] rounded-xl border border-gray-200 px-4 text-right text-[15px] focus:outline-none focus:ring-2 focus:ring-[#886CE8]/20 focus:border-[#886CE8]" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-[15px] font-semibold text-gray-800 mb-2 text-right">العنوان</label>
                        <input type="text" placeholder="أدخل العنوان" class="w-full h-[52px] rounded-xl border border-gray-200 px-4 text-right text-[15px] focus:outline-none focus:ring-2 focus:ring-[#886CE8]/20 focus:border-[#886CE8]">
                    </div>
                    <div>
                        <label class="block text-[15px] font-semibold text-gray-800 mb-2 text-right">اسم المالك</label>
                        <input type="text" placeholder="أدخل اسم المالك" class="w-full h-[52px] rounded-xl border border-gray-200 px-4 text-right text-[15px] focus:outline-none focus:ring-2 focus:ring-[#886CE8]/20 focus:border-[#886CE8]">
                    </div>
                    <div>
                        <label class="block text-[15px] font-semibold text-gray-800 mb-2 text-right">رقم الهوية/السجل</label>
                        <input type="text" placeholder="أدخل رقم الهوية أو السجل التجاري" class="w-full h-[52px] rounded-xl border border-gray-200 px-4 text-right text-[15px] focus:outline-none focus:ring-2 focus:ring-[#886CE8]/20 focus:border-[#886CE8]">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-[15px] font-semibold text-gray-800 mb-2 text-right">رقم الشهادة الضريبية</label>
                        <input type="text" placeholder="أدخل رقم الشهادة الضريبية" class="w-full h-[52px] rounded-xl border border-gray-200 px-4 text-right text-[15px] focus:outline-none focus:ring-2 focus:ring-[#886CE8]/20 focus:border-[#886CE8]">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-[15px] font-semibold text-gray-800 mb-2 text-right">شرح موجز عن دار النشر</label>
                        <textarea rows="4" placeholder="اكتب وصفاً موجزاً عن دار النشر..." class="w-full rounded-xl border border-gray-200 p-4 text-right text-[15px] resize-none focus:outline-none focus:ring-2 focus:ring-[#886CE8]/20 focus:border-[#886CE8]"></textarea>
                    </div>
                </div>

                <div class="mt-8">
                    <label class="block text-[15px] font-semibold text-gray-800 mb-3 text-right">تحديد الموقع على الخريطة</label>
                    <div class="rounded-xl border-2 border-dashed border-gray-300 bg-gray-50 min-h-[220px] flex flex-col items-center justify-center text-gray-400 cursor-pointer hover:bg-gray-100 transition">
                        <svg class="w-12 h-12 text-[#886CE8] mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <p class="text-sm text-gray-500">انقر لتحديد الموقع على الخريطة</p>
                    </div>
                </div>

                <div class="flex items-center justify-between mt-8 pt-6 border-t border-gray-100">
                    <span class="text-[16px] font-semibold text-[#1F2937]">الحالة</span>
                    <label class="relative inline-flex items-center cursor-pointer select-none">
                        <input type="checkbox" checked class="sr-only peer">
                        <div class="w-[76px] h-[34px] rounded-full bg-[#C4CDD5] peer-checked:bg-[#22C55E] transition-colors duration-300 relative">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-white text-[12px] font-semibold opacity-0 peer-checked:opacity-100 transition-opacity z-10 pointer-events-none">مفعل</span>
                            <div class="absolute top-[3px] right-[3px] w-7 h-7 bg-white rounded-full shadow-sm transition-all duration-300 peer-checked:right-[calc(100%-31px)]"></div>
                        </div>
                    </label>
                </div>

                <div class="flex items-center justify-end gap-3 mt-8">
                    <button type="button" class="h-12 px-8 rounded-xl bg-[#886CE8] text-white font-semibold hover:bg-[#7758E6] transition shadow-md">إضافة</button>
                    <a href="publishers-management.html" class="h-12 px-8 rounded-xl border border-gray-300 text-gray-600 font-semibold flex items-center hover:bg-gray-50 transition">إلغاء</a>
                </div>
            </div>
        </main>
    </div>

    <div id="logoutModal" class="fixed inset-0 z-[999999] hidden bg-black/40 backdrop-blur-[2px] items-center justify-center p-4">
        <div class="relative bg-white w-full max-w-[520px] rounded-[28px] px-8 py-10 shadow-2xl text-center">
            <button onclick="closeLogoutModal()" class="absolute top-5 left-5 text-gray-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6L18 18M6 18L18 6"/></svg></button>
            <img src="imgs/icons/out.svg" class="w-14 h-14 mx-auto mb-8" alt="">
            <h2 class="text-xl font-bold text-gray-800 mb-10">هل أنت متأكد أنك تريد تسجيل الخروج؟</h2>
            <div class="flex gap-4"><button class="flex-1 h-14 rounded-2xl bg-[#D91E18] text-white font-bold">نعم</button><button onclick="closeLogoutModal()" class="flex-1 h-14 rounded-2xl border-2 border-gray-500 text-gray-600 font-bold">إلغاء</button></div>
        </div>
    </div><script src="js/rich-editor.js"></script>
    <script src="js/publisher-shared.js"></script>
    <script src="js/legal-nav.js"></script>
    <script src="js/render-sidebar.js"></script>
    <script>renderSidebar('authors');</script>
</body>
</html>

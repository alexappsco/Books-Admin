<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سياسة الخصوصية - Youni</title>
    <link href="css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', sans-serif; }
        .header-bg { background: rgba(136, 108, 232, 1); }
        .active-link { background: rgba(136, 108, 232, 0.3); font-weight: 700; }
        .nav-link { font-size: 14px; font-weight: 500; transition: all 0.3s; }
    </style>
</head>
<body class="bg-gray-50">

    <header class="header-bg h-16 w-full flex items-center justify-between px-4 md:px-8 fixed top-0 z-[100]">
        <div class="flex items-center">
            <img src="imgs/logoHeader.png" alt="Youni" class="h-8 md:h-10">
        </div>
        <div class="flex items-center gap-4 text-white">
            <div class="flex items-center gap-4 border-l pl-4 border-white/20">
                <div class="relative cursor-pointer">
                    <span class="absolute -top-1 -right-1 bg-red-500 text-[10px] rounded-full px-1">1</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-gray-200 overflow-hidden">
                        <img src="https://ui-avatars.com/api/?name=User" alt="">
                    </div>
                    <span class="hidden md:block text-sm font-medium">اسم المستخدم</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-white outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-[80] hidden"></div>

    <div class="flex pt-16">
        <aside id="sidebar" class="w-64 h-[calc(100vh-64px)] fixed right-0 top-16 z-[90] overflow-y-auto transition-transform duration-300 md:translate-x-0 translate-x-full shadow-2xl md:shadow-none bg-white md:bg-[rgba(136,108,232,0.1)]">
            <nav id="sidebar-nav" class="mt-6 px-4 space-y-1"></nav>
        </aside>

        <main class="flex-1 md:mr-64 p-4 md:p-8 min-h-screen w-full">
            <div class="flex flex-row justify-between items-center gap-3 mb-8">
                <h1 class="text-[24px] font-bold text-gray-800">سياسة الخصوصية</h1>
                <button onclick="saveLegalContent()" class="bg-[#886CE8] hover:bg-[#7758E6] text-white font-bold text-[16px] px-6 h-12 rounded-xl shadow-md transition">
                    حفظ التغييرات
                </button>
            </div>

            <div class="space-y-8">
                <div>
                    <p class="text-[15px] font-medium text-gray-700 mb-3 text-right">النص بالعربي</p>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div id="editorArWrap"></div>
                    </div>
                </div>
                <div>
                    <p class="text-[15px] font-medium text-gray-700 mb-3 text-right">النص بالإنجليزي</p>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div id="editorEnWrap"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="saveToast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#886CE8] text-white px-6 py-3 rounded-xl shadow-lg z-[200] hidden">تم حفظ التغييرات بنجاح</div>

    <div id="logoutModal" class="fixed inset-0 z-[999999] hidden bg-black/40 backdrop-blur-[2px] items-center justify-center p-4">
        <div class="relative bg-white w-full max-w-[520px] rounded-[28px] px-5 sm:px-8 py-8 sm:py-10 shadow-2xl">
            <button onclick="closeLogoutModal()" class="absolute top-5 left-5 text-[#667085] hover:opacity-70 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6L18 18M6 18L18 6"/></svg>
            </button>
            <div class="flex flex-col items-center text-center">
                <div class="w-[90px] h-[90px] rounded-[24px] bg-[#F3F4F6] flex items-center justify-center mb-8">
                    <img src="imgs/icons/out.svg" alt="logout" class="w-12 h-12">
                </div>
                <h2 class="text-[20px] font-bold text-[#1F2937] mb-10">هل أنت متأكد أنك تريد تسجيل الخروج؟</h2>
                <div class="w-full flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-center gap-4">
                    <button class="h-[56px] flex-1 rounded-2xl bg-[#D91E18] text-white text-[16px] font-bold hover:bg-[#BF1611] transition">نعم</button>
                    <button onclick="closeLogoutModal()" class="h-[56px] flex-1 rounded-2xl border-2 border-[#64748B] text-[#64748B] text-[16px] font-bold hover:bg-[#F8FAFC] transition">إلغاء</button>
                </div>
            </div>
        </div>
    </div><script src="js/rich-editor.js"></script>
    <script>
        initEditor('editorAr', 'rtl');
        initEditor('editorEn', 'ltr');
    </script>
    <script src="js/legal-nav.js"></script>
    <script src="js/render-sidebar.js"></script>
    <script>renderSidebar('legal');</script>
</body>
</html>

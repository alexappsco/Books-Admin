<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - Youni</title>
    <link href="css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', sans-serif; }
        .header-bg { background: rgba(136, 108, 232, 1); }
        .active-link { background: rgba(136, 108, 232, 0.3); font-weight: 700; }
        .nav-link { font-size: 14px; font-weight: 500; transition: all 0.3s; }
        #addDropdown { display: none; }
        #addDropdown.show { display: block; }
    </style>
</head>
<body class="bg-gray-50">

    <header class="header-bg h-16 w-full flex items-center justify-between px-4 md:px-8 fixed top-0 z-[100]">
        <div class="flex items-center">
            <img src="imgs/logoHeader.png" alt="Youni" class="h-8 md:h-10">
        </div>
        <div class="flex items-center gap-4 text-white">
            <div class="flex items-center gap-4 border-l pl-4 border-white/20">
                <div class="relative cursor-pointer">
                    <span class="absolute -top-1 -right-1 bg-red-500 text-[10px] rounded-full px-1">1</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-gray-200 overflow-hidden">
                        <img src="https://ui-avatars.com/api/?name=User" alt="">
                    </div>
                    <span class="hidden md:block text-sm font-medium">اسم المستخدم</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-white outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-[80] hidden"></div>

    <div class="flex pt-16">
        <aside id="sidebar" class="w-64 h-[calc(100vh-64px)] fixed right-0 top-16 z-[90] overflow-y-auto transition-transform duration-300 md:translate-x-0 translate-x-full shadow-2xl md:shadow-none bg-white md:bg-[rgba(136,108,232,0.1)]">
            <nav id="sidebar-nav" class="mt-6 px-4 space-y-1"></nav>
        </aside>

        <main class="flex-1 md:mr-64 p-4 md:p-8 min-h-screen w-full">
            <div class="flex flex-row justify-between items-center gap-3 mb-8">
                <h1 class="text-[24px] font-bold text-gray-800">تواصل معنا</h1>
                <button onclick="saveContacts()" class="bg-[#886CE8] hover:bg-[#7758E6] text-white font-bold text-[16px] px-6 h-12 rounded-xl shadow-md transition">
                    حفظ التغييرات
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
                <div class="flex items-center justify-between gap-4 mb-6">
                    <h2 class="text-[18px] font-bold text-gray-800">وسائل التواصل المضافة</h2>
                    <div class="relative">
                        <button id="addBtn" onclick="toggleAddDropdown(event)" class="w-12 h-12 bg-[#886CE8] hover:bg-[#7758E6] text-white text-2xl font-light rounded-xl flex items-center justify-center shadow-md transition">
                            +
                        </button>
                        <div id="addDropdown" class="absolute left-0 top-14 w-[280px] bg-white rounded-2xl shadow-xl border border-gray-100 py-2 z-50 max-h-[400px] overflow-y-auto"></div>
                    </div>
                </div>
                <div id="contactsList" class="space-y-4"></div>
            </div>
        </main>
    </div>

    <div id="saveToast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#886CE8] text-white px-6 py-3 rounded-xl shadow-lg z-[200] hidden transition-opacity">
        تم حفظ التغييرات بنجاح
    </div>

    <div id="logoutModal" class="fixed inset-0 z-[999999] hidden bg-black/40 backdrop-blur-[2px] items-center justify-center p-4">
        <div class="relative bg-white w-full max-w-[520px] rounded-[28px] px-5 sm:px-8 py-8 sm:py-10 shadow-2xl">
            <button onclick="closeLogoutModal()" class="absolute top-5 left-5 text-[#667085] hover:opacity-70 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6L18 18M6 18L18 6"/>
                </svg>
            </button>
            <div class="flex flex-col items-center text-center">
                <div class="w-[90px] h-[90px] rounded-[24px] bg-[#F3F4F6] flex items-center justify-center mb-8">
                    <img src="imgs/icons/out.svg" alt="logout" class="w-12 h-12">
                </div>
                <h2 class="text-[20px] font-bold text-[#1F2937] mb-10">هل أنت متأكد أنك تريد تسجيل الخروج؟</h2>
                <div class="w-full flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-center gap-4">
                    <button class="h-[56px] flex-1 rounded-2xl bg-[#D91E18] text-white text-[16px] font-bold hover:bg-[#BF1611] transition">نعم</button>
                    <button onclick="closeLogoutModal()" class="h-[56px] flex-1 rounded-2xl border-2 border-[#64748B] text-[#64748B] text-[16px] font-bold hover:bg-[#F8FAFC] transition">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

<script>
const PLATFORMS = {
    phone:    { label: 'Phone Number', placeholder: '+966 22 333 4444', bg: '#886CE8' },
    whatsapp: { label: 'WhatsApp',     placeholder: '+966 22 333 4444', bg: '#25D366' },
    email:    { label: 'E-mail',       placeholder: 'example@gmail.com', bg: '#EA4335' },
    facebook: { label: 'Facebook',     placeholder: 'facebook.com/Johndoe', bg: '#1877F2' },
    instagram:{ label: 'Instagram',    placeholder: 'instagram.com/johndoe', bg: '#E4405F' },
    telegram: { label: 'Telegram',     placeholder: 'telegram.com/johndoe', bg: '#26A5E4' },
    snapchat: { label: 'Snapchat',     placeholder: 'snapchat.com/add/johndoe', bg: '#FFFC00' },
    tiktok:   { label: 'TikTok',       placeholder: 'tiktok.com/@johndoe', bg: '#000000' }
};

let contacts = [
    { type: 'phone', value: '+966 22 333 4444' },
    { type: 'whatsapp', value: '+966 22 333 4444' },
    { type: 'email', value: 'example@gmail.com' },
    { type: 'facebook', value: 'facebook.com/Johndoe' },
    { type: 'instagram', value: 'instagram.com/johndoe' },
    { type: 'telegram', value: 'telegram.com/johndoe' }
];

function platformIcon(type, size) {
    const s = size || 22;
    const icons = {
        phone: `<svg width="${s}" height="${s}" fill="white" viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.56.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.56 1 1 0 01-.25 1.01l-2.2 2.22z"/></svg>`,
        whatsapp: `<svg width="${s}" height="${s}" fill="white" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.034L.789 23.492a.75.75 0 00.918.918l4.458-1.495A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.006-1.372l-.357-.212-3.305 1.108 1.108-3.223-.233-.371A9.818 9.818 0 1112 21.818z"/></svg>`,
        email: `<svg width="${s}" height="${s}" fill="white" viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>`,
        facebook: `<svg width="${s}" height="${s}" fill="white" viewBox="0 0 24 24"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.413c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97H15.83c-1.491 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>`,
        instagram: `<svg width="${s}" height="${s}" fill="white" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 1.366.062 2.633.35 3.608 1.325.975.975 1.262 2.242 1.324 3.608.058 1.266.07 1.646.07 4.85s-.012 3.584-.07 4.85c-.062 1.366-.35 2.633-1.324 3.608-.975.975-2.242 1.262-3.608 1.324-1.266.058-1.646.07-4.85.07s-3.584-.012-4.85-.07c-1.366-.062-2.633-.35-3.608-1.324-.975-.975-1.262-2.242-1.324-3.608C2.175 15.747 2.163 15.367 2.163 12s.012-3.584.07-4.85c.062-1.366.35-2.633 1.324-3.608.975-.975 2.242-1.262 3.608-1.324C8.416 2.175 8.796 2.163 12 2.163zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12s.014 3.667.072 4.947c.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24s3.667-.014 4.947-.072c4.354-.2 6.782-2.618 6.979-6.98C23.986 15.667 24 15.259 24 12s-.014-3.667-.072-4.947C23.728 2.69 21.31.273 16.947.073 15.667.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>`,
        telegram: `<svg width="${s}" height="${s}" fill="white" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0h-.056zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>`,
        snapchat: `<svg width="${s}" height="${s}" fill="white" viewBox="0 0 24 24"><path d="M12.206.793c.99 0 4.347.276 5.93 3.821.529 1.193.403 3.219.299 4.847l-.003.06c-.012.18-.022.345-.03.51.075.045.203.09.401.09.3-.016.659-.12 1.033-.301.165-.088.344-.104.464-.104.182 0 .359.029.509.09.45.149.734.479.734.838.015.449-.39.839-1.213 1.168-.089.029-.209.075-.344.119-.45.135-1.139.36-1.333.81-.09.224-.061.524.12.868l.015.015c.06.136 1.526 3.475 4.791 4.014.255.044.435.27.42.509 0 .075-.015.149-.045.225-.24.569-1.273.988-3.146 1.271-.059.091-.12.375-.164.57-.029.179-.074.36-.134.553-.076.271-.27.405-.555.405h-.03c-.135 0-.313-.031-.538-.074-.36-.075-.765-.135-1.273-.135-.3 0-.599.015-.913.074-.6.104-1.123.464-1.723.884-.853.599-1.826 1.288-3.294 1.288-.06 0-.119-.015-.18-.015h-.149c-1.468 0-2.427-.675-3.279-1.288-.599-.42-1.107-.779-1.707-.884-.314-.045-.629-.074-.928-.074-.54 0-.958.089-1.272.149-.211.043-.391.074-.54.074-.374 0-.523-.224-.583-.42-.061-.192-.09-.389-.135-.567-.046-.181-.105-.494-.166-.57-1.918-.222-2.95-.642-3.189-1.226-.031-.063-.052-.15-.055-.225-.015-.243.165-.465.42-.509 3.264-.54 4.73-3.879 4.791-4.02l.016-.029c.18-.345.224-.645.119-.869-.195-.434-.884-.658-1.332-.809-.121-.029-.24-.074-.346-.119-1.107-.435-1.257-.93-1.197-1.273.09-.479.674-.793 1.168-.793.146 0 .27.029.383.074.45.149.842.27 1.152.27.18 0 .299-.045.383-.09l.016-.061c-.105-1.628-.24-3.654.269-4.847C7.691 1.094 11.064.817 12.054.817l.152-.024z"/></svg>`,
        tiktok: `<svg width="${s}" height="${s}" fill="white" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>`
    };
    return icons[type] || icons.phone;
}

function renderContacts() {
    const list = document.getElementById('contactsList');
    list.innerHTML = contacts.map((c, i) => {
        const p = PLATFORMS[c.type];
        return `<div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0" style="background:${p.bg}">
                ${platformIcon(c.type)}
            </div>
            <input type="text" value="${c.value}" placeholder="${p.placeholder}"
                oninput="contacts[${i}].value=this.value"
                class="flex-1 h-[56px] bg-[#F3F4F6] rounded-xl px-5 text-[15px] text-gray-700 outline-none focus:ring-2 focus:ring-[#886CE8]/30 transition text-right" />
            <button onclick="removeContact(${i})" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 transition shrink-0">
                <img src="imgs/icons/trach.svg" class="w-5 h-5" alt="حذف">
            </button>
        </div>`;
    }).join('');
    renderDropdown();
}

function renderDropdown() {
    const added = new Set(contacts.map(c => c.type));
    const dropdown = document.getElementById('addDropdown');
    dropdown.innerHTML = Object.entries(PLATFORMS).map(([key, p]) => {
        const isAdded = added.has(key);
        return `<button onclick="addContact('${key}')" ${isAdded ? 'disabled' : ''}
            class="w-full flex items-center gap-3 px-4 py-3 text-left transition ${isAdded ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-50 cursor-pointer'}">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background:${p.bg}">
                ${platformIcon(key, 18)}
            </div>
            <div class="flex-1 text-right">
                <p class="text-[14px] font-medium text-gray-800">${p.label}</p>
                ${isAdded ? '<p class="text-[11px] text-gray-400">تمت الإضافة مسبقاً</p>' : ''}
            </div>
        </button>`;
    }).join('');
}

function toggleAddDropdown(e) {
    e.stopPropagation();
    document.getElementById('addDropdown').classList.toggle('show');
}

function addContact(type) {
    if (contacts.some(c => c.type === type)) return;
    contacts.push({ type, value: '' });
    renderContacts();
    document.getElementById('addDropdown').classList.remove('show');
}

function removeContact(index) {
    contacts.splice(index, 1);
    renderContacts();
}

function saveContacts() {
    const toast = document.getElementById('saveToast');
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 2500);
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('translate-x-full');
    document.getElementById('overlay').classList.toggle('hidden');
    document.body.classList.toggle('overflow-hidden');
}

function openLogoutModal() {
    const m = document.getElementById('logoutModal');
    m.classList.remove('hidden'); m.classList.add('flex');
    document.body.style.overflow = 'hidden';
}
function closeLogoutModal() {
    const m = document.getElementById('logoutModal');
    m.classList.add('hidden'); m.classList.remove('flex');
    document.body.style.overflow = 'auto';
}

document.addEventListener('click', () => {
    document.getElementById('addDropdown').classList.remove('show');
});
document.getElementById('addDropdown').addEventListener('click', e => e.stopPropagation());

renderContacts();
</script>
    <script src="js/legal-nav.js"></script>
    <script src="js/render-sidebar.js"></script>
    <script>renderSidebar('contact');</script>
</body>
</html>
